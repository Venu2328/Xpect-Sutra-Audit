<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xpect | Autonomous AI Sutra Auditor</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
        :root {
            --maroon: #97144D; --maroon-dark: #6B0F38;
            --gold: #C9A227; --gold-light: #E6C566;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Source Sans 3', sans-serif;
            background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 50%, #4A0A28 100%);
            min-height: 100%;
        }
        .heading-font { font-family: 'Playfair Display', serif; }
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .pulse-indicator {
            width: 12px; height: 12px; background: #22C55E; border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); transform: scale(1.1); }
        }
        .scanning::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.3), transparent);
            animation: scan 1.5s ease-in-out infinite;
        }
        @keyframes scan { 0% { left: -100%; } 100% { left: 100%; } }
        .stat-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .stat-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        .upload-btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--maroon-dark); font-weight: 700; padding: 14px 32px;
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .progress-bar { height: 8px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .sutra-tag { background: rgba(201, 162, 39, 0.2); border: 1px solid var(--gold); padding: 2px 8px; border-radius: 4px; font-size: 10px; color: var(--gold-light); }
    </style>
 </head>
 <body class="h-full overflow-auto">
  <div class="min-h-full p-6 md:p-8">
   <header class="glass-panel p-6 mb-8">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
     <div class="flex items-center gap-4">
      <div class="bg-gold p-3 rounded-lg" style="background: var(--gold);">
       <svg width="28" height="28" viewbox="0 0 24 24" fill="none" stroke="#97144D" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z" /><path d="M2 17l10 5 10-5" /><path d="M2 12l10 5 10-5" /></svg>
      </div>
      <div>
       <h1 class="heading-font text-3xl font-bold text-white uppercase tracking-wider">Xpect</h1>
       <p style="color: var(--gold-light);" class="text-xs font-bold uppercase tracking-widest opacity-80">Autonomous AI Sutra Auditor</p>
      </div>
     </div>
     <div class="flex items-center gap-4">
        <span class="sutra-tag">RBI FREE-AI v2.0</span>
        <div class="flex items-center gap-3 glass-panel px-4 py-2">
            <div class="pulse-indicator"></div><span class="text-white font-semibold text-xs uppercase">Engine Live</span>
        </div>
     </div>
    </div>
   </header>

   <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div id="transactions-card" class="glass-panel stat-card p-6 relative overflow-hidden">
     <p class="text-white opacity-70 text-xs font-bold uppercase mb-2">Total Records Audited</p>
     <p id="transaction-count" class="heading-font text-5xl font-bold text-white">0</p>
     <div class="progress-bar mt-6"><div id="transaction-progress" class="progress-fill" style="width: 0%;"></div></div>
    </div>
    <div id="risk-card" class="glass-panel stat-card p-6 relative overflow-hidden">
     <p class="text-white opacity-70 text-xs font-bold uppercase mb-2">Sutra Risk Variance</p>
     <p id="risk-score" class="heading-font text-5xl font-bold text-white">0<span class="text-2xl opacity-50">%</span></p>
     <div class="progress-bar mt-6"><div id="risk-progress" class="progress-fill" style="width: 0%; background: #EF4444;"></div></div>
    </div>
    <div id="health-card" class="glass-panel stat-card p-6 relative overflow-hidden">
     <p class="text-white opacity-70 text-xs font-bold uppercase mb-2">Compliance Health Index</p>
     <p id="health-score" class="heading-font text-5xl font-bold text-white">0%</p>
     <div class="progress-bar mt-6"><div id="health-progress" class="progress-fill" style="width: 0%; background: #22C55E;"></div></div>
    </div>
   </section>

   <section class="glass-panel p-10 text-center border-2 border-dashed border-white/20">
    <h3 class="heading-font text-2xl font-bold text-white mb-2">7 Sutra Compliance Engine</h3>
    <p class="text-white opacity-60 text-sm mb-8 max-w-xl mx-auto">Analyzing: Trust • Fairness • Accountability • Safety • Transparency • Innovation • Human-Centricity</p>
    <div class="flex flex-col items-center gap-6">
        <input type="file" id="csvFile" accept=".csv" class="text-white text-sm file:mr-4 file:py-2 file:px-6 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-white file:text-maroon-700 hover:file:bg-gold-light transition-all">
        <button id="upload-btn" onclick="processAudit()" class="upload-btn w-full md:w-64">Run Xpect Audit</button>
    </div>
   </section>
  </div>

  <script>
    function processAudit() {
        const fileInput = document.getElementById('csvFile');
        const btn = document.getElementById('upload-btn');
        if (!fileInput.files[0]) { alert("Error: No dataset found."); return; }

        btn.innerText = "CALIBRATING SUTRAS...";
        btn.disabled = true;
        ['transactions-card', 'risk-card', 'health-card'].forEach(id => document.getElementById(id).classList.add('scanning'));

        const reader = new FileReader();
        reader.onload = function(e) {
            const rows = e.target.result.split(/\r?\n/).filter(line => line.trim().length > 0);
            if (rows.length <= 1) { alert("Error: CSV is invalid."); resetUI(); return; }

            const headers = rows[0].toLowerCase().split(',').map(h => h.trim());
            const dataRows = rows.slice(1);
            
            // AUTOMATIC 7 SUTRA MAPPING
            const keywords = ['trust', 'fair', 'account', 'safe', 'score', 'audit', 'compliance', 'risk'];
            const targetCols = headers.reduce((acc, h, i) => {
                if (keywords.some(k => h.includes(k))) acc.push(i);
                return acc;
            }, []);

            if (targetCols.length === 0) {
                alert("SCHEMA ERROR: No Sutra columns found. Please ensure your CSV headers include 'Compliance' or 'Risk'.");
                resetUI();
                return;
            }

            let scoreSum = 0; let totalCells = 0;
            dataRows.forEach(row => {
                const cells = row.split(',');
                targetCols.forEach(idx => {
                    const val = parseFloat(cells[idx]);
                    if (!isNaN(val)) {
                        scoreSum += (val <= 1 && val > 0) ? val * 100 : val;
                        totalCells++;
                    }
                });
            });

            const health = totalCells > 0 ? Math.round(scoreSum / totalCells) : 0;
            const risk = 100 - health;

            setTimeout(() => {
                document.getElementById('transaction-count').innerText = dataRows.length.toLocaleString();
                document.getElementById('risk-score').innerHTML = risk + "<span class='text-2xl opacity-50'>%</span>";
                document.getElementById('health-score').innerText = health + "%";
                
                document.getElementById('transaction-progress').style.width = "100%";
                document.getElementById('risk-progress').style.width = risk + "%";
                document.getElementById('health-progress').style.width = health + "%";

                ['transactions-card', 'risk-card', 'health-card'].forEach(id => document.getElementById(id).classList.remove('scanning'));
                btn.innerText = "AUDIT COMPLETE";
                btn.style.background = "#22C55E";
                btn.disabled = false;

                alert(`XPECT SUTRA CERTIFICATE\n--------------------------\nRecords: ${dataRows.length}\nCompliance Avg: ${health}%\nRisk Variance: ${risk}%\n\nResult: Aligned with RBI 7 Sutra Framework.`);
            }, 1800);
        };
        reader.readAsText(fileInput.files[0]);
    }

    function resetUI() {
        const btn = document.getElementById('upload-btn');
        btn.innerText = "Run Xpect Audit";
        btn.disabled = false;
        document.querySelectorAll('.glass-panel').forEach(el => el.classList.remove('scanning'));
    }
  </script>
 </body>
</html>
