<script>
    // SECURE BRIDGE: This function talks to your Vercel secret without exposing the key
    async function callSutraAI(rowData) {
        try {
            const response = await fetch('/api/audit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rowData: rowData })
            });
            const result = await response.json();
            // Returns the AI's explanation from the Gemini model
            return result.candidates[0].content.parts[0].text;
        } catch (error) {
            console.error("AI Audit Connection Failed:", error);
            return "Connection to Sutra AI Engine failed.";
        }
    }

    async function processAudit() {
        const fileInput = document.getElementById('csvFile');
        const btn = document.getElementById('upload-btn');
        if (!fileInput.files[0]) { alert("Error: No dataset found."); return; }

        btn.innerText = "CALIBRATING SUTRAS...";
        btn.disabled = true;
        ['transactions-card', 'risk-card', 'health-card'].forEach(id => document.getElementById(id).classList.add('scanning'));

        const reader = new FileReader();
        reader.onload = async function(e) {
            const rows = e.target.result.split(/\r?\n/).filter(line => line.trim().length > 0);
            if (rows.length <= 1) { alert("Error: CSV is invalid."); resetUI(); return; }

            const dataRows = rows.slice(1);
            
            // MATH LOGIC: Your existing compliance calculation
            let health = Math.floor(Math.random() * (98 - 85 + 1)) + 85; // Simulated for demo
            let risk = 100 - health;

            // NEW AI LOGIC: Send the first row of data to Gemini for a "Deep Audit"
            const aiAnalysis = await callSutraAI(dataRows[0]);

            // UPDATE UI
            document.getElementById('transaction-count').innerText = dataRows.length.toLocaleString();
            document.getElementById('risk-score').innerHTML = risk + "<span class='text-2xl opacity-50'>%</span>";
            document.getElementById('health-score').innerText = health + "%";
            
            document.getElementById('transaction-progress').style.width = "100%";
            document.getElementById('risk-progress').style.width = risk + "%";
            document.getElementById('health-progress').style.width = health + "%";

            ['transactions-card', 'risk-card', 'health-card'].forEach(id => document.getElementById(id).classList.remove('scanning'));
            btn.innerText = "AUDIT COMPLETE";
            btn.style.background = "#22C55E";
            btn.disabled = false;

            // The "Wow" factor for your pitch: The AI's live explanation
            alert(`XPECT SUTRA AI ANALYSIS\n--------------------------\n${aiAnalysis}\n\nCompliance: ${health}% | Risk: ${risk}%`);
        };
        reader.readAsText(fileInput.files[0]);
    }

    function resetUI() {
        const btn = document.getElementById('upload-btn');
        btn.innerText = "Run Xpect Audit";
        btn.disabled = false;
        document.querySelectorAll('.glass-panel').forEach(el => el.classList.remove('scanning'));
    }
</script>
