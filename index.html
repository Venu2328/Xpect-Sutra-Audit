<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPECT | Sovereign AI Governance</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --crimson: #97144D; --cream: #FAF9F6; --glass-white: rgba(255, 255, 255, 0.7); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--cream); color: #1a1a1a; overflow-x: hidden; }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', serif; }
        .nebula-cream { background: radial-gradient(circle at 10% 20%, rgba(151, 20, 77, 0.05) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(151, 20, 77, 0.05) 0%, transparent 40%); }
        .glass-card { background: var(--glass-white); backdrop-filter: blur(16px); border: 1px solid rgba(151, 20, 77, 0.08); border-radius: 32px; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
        .btn-elite { background: var(--crimson); color: white; padding: 16px 40px; border-radius: 100px; font-weight: 700; transition: all 0.4s ease; border: none; cursor: pointer; }
        .btn-elite:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(151, 20, 77, 0.2); }
        .btn-elite:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .scanner-line { height: 2px; background: linear-gradient(90deg, transparent, var(--crimson), transparent); position: absolute; width: 100%; top: -2px; opacity: 0; z-index: 10; }
        .is-scanning .scanner-line { animation: scan 2s linear infinite; opacity: 1; }
        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    </style>
</head>
<body class="min-h-screen nebula-cream">
    <nav class="fixed w-full z-50 top-0 px-8 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center glass-card px-8 py-4 !rounded-2xl">
            <span class="text-2xl font-black tracking-tighter serif-font italic">XPECT</span>
            <div class="hidden md:flex gap-10 text-[10px] font-bold tracking-[0.2em] uppercase opacity-60">
                <span>Vault</span><span>Infrastructure</span>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-8">
        <div class="max-w-4xl mx-auto text-center mb-16">
            <h1 class="text-5xl md:text-7xl mb-8">Engineering outcomes for the <span class="italic text-[#97144D]">99th percentile</span>.</h1>
        </div>

        <section class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 mb-24 text-center">
            <div class="glass-card p-10 dashboard-card">
                <div class="scanner-line"></div>
                <h4 class="text-[10px] font-bold opacity-30 uppercase mb-4 tracking-widest">Audited Capacity</h4>
                <p id="transaction-count" class="text-5xl font-bold serif-font">0</p>
            </div>
            <div class="glass-card p-10 dashboard-card">
                <div class="scanner-line"></div>
                <h4 class="text-[10px] font-bold opacity-30 uppercase mb-4 tracking-widest">Risk Variance</h4>
                <p id="risk-score" class="text-5xl font-bold serif-font">0%</p>
            </div>
            <div class="glass-card p-10 dashboard-card">
                <div class="scanner-line"></div>
                <h4 class="text-[10px] font-bold opacity-30 uppercase mb-4 tracking-widest">Sutra Health</h4>
                <p id="health-score" class="text-5xl font-bold serif-font text-[#97144D]">0%</p>
            </div>
        </section>

        <section class="max-w-3xl mx-auto text-center">
            <div class="glass-card p-12 mb-8">
                <input type="file" id="csvFile" accept=".csv" 
                       class="block mx-auto text-sm text-gray-400 mb-8 file:mr-4 file:py-2 file:px-6 file:rounded-full file:border-0 file:bg-[#97144D]/10 file:text-[#97144D] cursor-pointer">
                <button onclick="processAudit()" id="upload-btn" class="btn-elite">INITIALIZE PROTOCOL</button>
            </div>

            <div id="agent-log" class="hidden text-left glass-card p-8 bg-black/[0.02] border-none mb-8">
                <h4 class="text-[10px] font-black uppercase text-[#97144D] mb-4 tracking-widest">Live Audit Stream</h4>
                <div id="log-entries" class="text-[12px] font-mono opacity-60 space-y-2"></div>
            </div>

            <div id="results-display" class="hidden text-left glass-card p-10 border-l-4 border-[#97144D]">
                <h3 class="text-xs font-black uppercase text-[#97144D] mb-2 tracking-widest">Linguistic Authority Verdict</h3>
                <div id="ai-verdict-text" class="text-2xl serif-font text-black/80 mb-6">Analyzing...</div>
                
                <div class="grid grid-cols-2 gap-4 border-t border-black/5 pt-6">
                    <div>
                        <p class="text-[9px] font-bold uppercase opacity-40">Concentration Risk</p>
                        <p id="r-conc" class="text-sm font-semibold">--</p>
                    </div>
                    <div>
                        <p class="text-[9px] font-bold uppercase opacity-40">Velocity Analytics</p>
                        <p id="r-vel" class="text-sm font-semibold">--</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const auditSteps = [
            "Establishing secure vault handshake...",
            "Decrypting financial vectors...",
            "Calculating Gini Concentration Index...",
            "Running Z-Score Outlier Detection...",
            "Finalizing institutional verdict..."
        ];
        
        async function runLiveLogs() {
            const container = document.getElementById('log-entries');
            document.getElementById('agent-log').classList.remove('hidden');
            container.innerHTML = '';
            for (const step of auditSteps) {
                const entry = document.createElement('div');
                entry.innerHTML = `✦ ${step}`;
                container.appendChild(entry);
                await new Promise(r => setTimeout(r, 600));
            }
        }

        async function processAudit() {
            const fileInput = document.getElementById('csvFile');
            const btn = document.getElementById('upload-btn');
            const file = fileInput.files[0];
            
            if (!file) return alert("Select a CSV for auditing.");
            
            // UI State Start
            btn.disabled = true;
            btn.innerText = "SCRUBBING...";
            document.querySelectorAll('.glass-card').forEach(el => el.classList.add('is-scanning'));
            
            const logPromise = runLiveLogs();
            const formData = new FormData();
            formData.append('file', file);

            try {
                // Change URL to '/api/audit' for Vercel deployment or your specific local port
                const res = await fetch('/api/audit', { 
                    method: 'POST', 
                    body: formData 
                });
                
                const data = await res.json();
                await logPromise;

                if (data.status === "success") {
                    // Mapping to your current app.py keys
                    document.getElementById('transaction-count').innerText = data.metrics.nodes;
                    document.getElementById('risk-score').innerText = data.metrics.risk;
                    document.getElementById('health-score').innerText = data.metrics.health;
                    
                    document.getElementById('ai-verdict-text').innerText = data.analyst_report.verdict;
                    document.getElementById('r-conc').innerText = data.analyst_report.concentration;
                    document.getElementById('r-vel').innerText = data.analyst_report.velocity;
                    
                    document.getElementById('results-display').classList.remove('hidden');
                    document.getElementById('results-display').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("Protocol Error: " + data.message);
                }
            } catch (e) { 
                console.error(e);
                alert("Backend Unreachable. Ensure your Flask app is running."); 
            } finally { 
                btn.disabled = false;
                btn.innerText = "INITIALIZE PROTOCOL";
                document.querySelectorAll('.glass-card').forEach(el => el.classList.remove('is-scanning')); 
            }
        }
    </script>
</body>
</html>
