<script>
const auditSteps = [
    "Establishing secure vault handshake...",
    "Injecting institutional datasets...",
    "Tokenizing PII using HMAC-SHA256...",
    "Running capital variance models...",
    "Detecting structural duplication vectors...",
    "Finalizing governance verdict..."
];

async function runLiveLogs() {
    const logContainer = document.getElementById('log-entries');
    document.getElementById('agent-log').classList.remove('hidden');
    logContainer.innerHTML = '';

    for (const step of auditSteps) {
        const entry = document.createElement('div');
        entry.innerHTML = `<span class="text-[#97144D] mr-2">✦</span> ${step}`;
        logContainer.appendChild(entry);
        logContainer.scrollTop = logContainer.scrollHeight;
        await new Promise(r => setTimeout(r, 650));
    }
}

function formatPercent(val) {
    if (!val) return "0%";
    return val;
}

async function processAudit() {

    const fileInput = document.getElementById('csvFile');
    const btn = document.getElementById('upload-btn');
    const display = document.getElementById('results-display');
    const logSection = document.getElementById('agent-log');

    if (!fileInput.files.length) {
        alert("Please select a CSV file.");
        return;
    }

    display.classList.add('hidden');
    logSection.classList.add('hidden');

    btn.innerText = "ENGINEERING RESULTS...";
    btn.disabled = true;

    document.querySelectorAll('.glass-card')
        .forEach(el => el.classList.add('is-scanning'));

    const logPromise = runLiveLogs();

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    try {

        const response = await fetch('/api/audit', {
            method: 'POST',
            body: formData
        });

        if (!response.ok) throw new Error("API unreachable");

        const data = await response.json();

        await logPromise;

        if (data.status !== "success") {
            throw new Error(data.message || data.error || "Unknown audit failure");
        }

        // ✅ FIELD ALIGNMENT WITH NEW BACKEND

        document.getElementById('transaction-count').innerText =
            formatPercent(data.audited_capacity);

        document.getElementById('risk-score').innerText =
            formatPercent(data.risk_score);

        document.getElementById('health-score').innerText =
            formatPercent(data.sutra_health);

        document.getElementById('ai-verdict-text').innerText =
            data.summary || "No linguistic verdict generated.";

        display.classList.remove('hidden');

    } catch (err) {

        console.error(err);

        alert("Protocol Error: " + err.message);

    } finally {

        btn.innerText = "PROTOCOL SEALED";
        btn.disabled = false;

        document.querySelectorAll('.glass-card')
            .forEach(el => el.classList.remove('is-scanning'));
    }
}
</script>
