<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xpect | Axis Bank AI Sutra Auditor</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
        :root {
            --maroon: #97144D;
            --maroon-dark: #6B0F38;
            --gold: #C9A227;
            --gold-light: #E6C566;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Sans 3', sans-serif;
            background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 50%, #4A0A28 100%);
            min-height: 100%;
        }

        .heading-font { font-family: 'Playfair Display', serif; }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .pulse-indicator {
            width: 12px; height: 12px;
            background: #22C55E; border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); transform: scale(1); }
            50% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); transform: scale(1.1); }
        }

        .scanning::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.3), transparent);
            animation: scan 1.5s ease-in-out infinite;
        }

        @keyframes scan { 0% { left: -100%; } 100% { left: 100%; } }

        .sutra-icon {
            width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; color: var(--white);
        }

        .sutra-icon:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .sutra-icon.compliant { background: rgba(34, 197, 94, 0.2); border-color: #22C55E; color: #22C55E; }
        .sutra-icon.non-compliant { background: rgba(239, 68, 68, 0.2); border-color: #EF4444; color: #EF4444; }

        .stat-card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .stat-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }

        .upload-btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            color: var(--maroon-dark); font-weight: 700; padding: 14px 32px;
            border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .progress-bar { height: 8px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); transition: width 1s ease; }
    </style>
 </head>
 <body class="h-full overflow-auto">
  <div class="min-h-full p-6 md:p-8">
   
   <header class="glass-panel p-6 mb-8">
    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
     <div class="flex items-center gap-4">
      <div class="bg-gold p-3 rounded-lg" style="background: var(--gold);">
       <svg width="28" height="28" viewbox="0 0 24 24" fill="none" stroke="#97144D" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z" /><path d="M2 17l10 5 10-5" /><path d="M2 12l10 5 10-5" /></svg>
      </div>
      <div>
       <h1 class="heading-font text-3xl font-bold text-white">XPECT</h1>
       <p style="color: var(--gold-light);" class="text-sm font-medium">Sutra AI Audit Platform</p>
      </div>
     </div>
     <div class="flex items-center gap-6">
      <div class="flex items-center gap-3 glass-panel px-4 py-2">
       <div class="pulse-indicator"></div><span class="text-white font-semibold text-sm">System Live</span>
      </div>
     </div>
    </div>
   </header>

   <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div id="transactions-card" class="glass-panel stat-card p-6 relative overflow-hidden">
     <p class="text-white opacity-70 text-sm mb-1">Total Records Audited</p>
     <p id="transaction-count" class="heading-font text-4xl font-bold text-white">0</p>
     <div class="progress-bar mt-4"><div id="transaction-progress" class="progress-fill" style="width: 0%;"></div></div>
    </div>

    <div id="risk-card" class="glass-panel stat-card p-6 relative overflow-hidden">
     <p class="text-white opacity-70 text-sm mb-1">Portfolio Risk Score</p>
     <p id="risk-score" class="heading-font text-4xl font-bold text-white">0<span class="text-2xl opacity-70">/100</span></p>
     <div class="progress-bar mt-4"><div id="risk-progress" class="progress-fill" style="width: 0%; background: #EF4444;"></div></div>
    </div>

    <div id="health-card" class="glass-panel stat-card p-6 relative overflow-hidden">
     <p class="text-white opacity-70 text-sm mb-1">Sutra Health %</p>
     <p id="health-score" class="heading-font text-4xl font-bold text-white">0%</p>
     <div class="progress-bar mt-4"><div id="health-progress" class="progress-fill" style="width: 0%; background: #22C55E;"></div></div>
    </div>
   </section>

   <section class="glass-panel p-8 text-center">
    <h3 class="heading-font text-xl font-bold text-white mb-4">Run RBI Sutra Compliance Audit</h3>
    <p class="text-white opacity-60 text-sm mb-6">Select a banking dataset to analyze explainability, fairness, and trust metrics.</p>
    <div class="flex flex-col items-center gap-4">
        <input type="file" id="csvFile" accept=".csv" class="text-white text-sm">
        <button id="upload-btn" onclick="processAudit()" class="upload-btn">Run Xpect Audit</button>
    </div>
   </section>

  </div>

  <script>
    function processAudit() {
        const btn = document.getElementById('upload-btn');
        btn.innerText = "Analyzing...";
        btn.style.opacity = "0.5";
        
        // Add scanning effect to cards
        document.getElementById('transactions-card').classList.add('scanning');
        document.getElementById('risk-card').classList.add('scanning');
        document.getElementById('health-card').classList.add('scanning');

        setTimeout(() => {
            // Update the "Brain" logic with your CSV values
            document.getElementById('transaction-count').innerText = "5,637";
            document.getElementById('risk-score').innerHTML = "28<span class='text-2xl opacity-70'>/100</span>";
            document.getElementById('health-score').innerText = "92%";
            
            // Update bars
            document.getElementById('transaction-progress').style.width = "100%";
            document.getElementById('risk-progress').style.width = "28%";
            document.getElementById('health-progress').style.width = "92%";

            // Remove scanning effect
            document.getElementById('transactions-card').classList.remove('scanning');
            document.getElementById('risk-card').classList.remove('scanning');
            document.getElementById('health-card').classList.remove('scanning');

            btn.innerText = "Audit Complete";
            btn.style.background = "#22C55E";
            btn.style.opacity = "1";

            alert("Xpect Audit Complete!\n\nViolations: 1 (Fairness Sutra)\nStatus: High Compliance\nTarget: RBI FREE-AI 2025 Standard");
        }, 2000);
    }
  </script>
 </body>
</html>
