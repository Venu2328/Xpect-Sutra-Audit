<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARBORN | Sovereign Neural Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #97144D;
            --accent: #ff4b2b;
            --bg: #030303;
        }

        body {
            font-family: 'Space+Grotesk', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Moving Particle Background */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.6;
        }

        /* Floating Logo Animation */
        .floating-logo {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        /* Glassmorphism & Shining Lights */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(151, 20, 77, 0.1) 0%, transparent 70%);
            pointer-events: none;
            transition: 0.5s;
        }

        .is-scanning {
            border-color: var(--primary);
            box-shadow: 0 0 50px rgba(151, 20, 77, 0.3);
        }

        /* Text Gradients */
        .shimmer-text {
            background: linear-gradient(90deg, #fff 0%, var(--primary) 50%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .btn-premium {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            box-shadow: 0 4px 15px rgba(151, 20, 77, 0.4);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn-premium:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(151, 20, 77, 0.6);
        }

        /* Log Stream Styling */
        #log-entries div {
            border-left: 2px solid var(--primary);
            padding-left: 12px;
            margin-bottom: 8px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="max-w-7xl mx-auto px-6 py-10 relative">
        <header class="text-center mb-16 floating-logo">
            <div class="inline-block mb-6">
                <div class="w-16 h-16 bg-gradient-to-tr from-[#97144D] to-[#ff4b2b] rounded-2xl rotate-45 flex items-center justify-center shadow-2xl">
                    <span class="text-white -rotate-45 font-bold text-2xl">S</span>
                </div>
            </div>
            <h1 class="text-7xl md:text-9xl font-bold tracking-tighter shimmer-text">STARBORN</h1>
            <p class="text-gray-500 tracking-[0.6em] text-[10px] uppercase mt-4">Sovereign Neural Governance</p>
        </header>

        <div class="grid lg:grid-cols-12 gap-10">
            <div class="lg:col-span-5 space-y-8">
                <section class="glass-card p-10 border-t border-white/20">
                    <h3 class="text-[10px] font-bold tracking-[0.4em] text-gray-400 mb-8 uppercase italic">Secure Ledger Deposit</h3>
                    
                    <div class="relative mb-8">
                        <input type="file" id="csvFile" accept=".csv" class="hidden">
                        <label for="csvFile" class="flex flex-col items-center justify-center border-2 border-dashed border-white/5 rounded-3xl p-12 cursor-pointer hover:bg-white/5 transition-all group">
                            <span class="text-gray-500 group-hover:text-[#97144D] transition-colors uppercase text-xs tracking-widest">Select CSV Vector</span>
                        </label>
                    </div>

                    <button onclick="processAudit()" id="upload-btn" class="btn-premium w-full py-6 rounded-2xl font-bold uppercase tracking-[0.3em] text-xs">
                        Initiate Neural Audit
                    </button>
                </section>

                <section id="agent-log" class="glass-card p-8 opacity-0 transition-all duration-1000">
                    <h4 class="text-[9px] text-[#97144D] mb-6 tracking-widest uppercase font-bold">Live Stream Process</h4>
                    <div id="log-entries" class="h-48 overflow-y-auto text-[11px] font-mono text-gray-400"></div>
                </section>
            </div>

            <div class="lg:col-span-7">
                <section id="results-display" class="hidden space-y-8">
                    <div class="grid grid-cols-2 gap-6">
                        <div class="glass-card p-10 group hover:is-scanning">
                            <div class="text-[10px] tracking-[0.3em] text-gray-500 mb-3 uppercase">Sutra Health</div>
                            <div id="health-score" class="text-6xl font-bold tracking-tighter text-white group-hover:text-[#97144D] transition-colors">--</div>
                        </div>
                        <div class="glass-card p-10 group hover:is-scanning">
                            <div class="text-[10px] tracking-[0.3em] text-gray-500 mb-3 uppercase">Risk Variance</div>
                            <div id="risk-score" class="text-6xl font-bold tracking-tighter text-white">--</div>
                        </div>
                    </div>

                    <div class="glass-card p-10 border-l-4 border-l-[#97144D]">
                        <div class="flex justify-between items-center mb-8">
                            <span class="text-[10px] tracking-widest text-gray-500 uppercase italic">Neural Verdict Analysis</span>
                            <span id="transaction-count" class="text-[10px] px-3 py-1 bg-[#97144D]/20 rounded-full text-[#97144D] font-bold tracking-widest">--</span>
                        </div>
                        <p id="ai-verdict-text" class="text-3xl md:text-4xl font-light text-gray-100 leading-tight tracking-tight">
                            Decrypting structural integrity...
                        </p>
                    </div>
                </section>
            </div>
        </div>

        <footer class="mt-32 text-center opacity-30">
            <p class="text-[9px] tracking-[1em] uppercase">Built for Sovereignty • Secured by Starborn</p>
        </footer>
    </div>

    <script>
        // --- BACKGROUND PARTICLES ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<80; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.5 + 0.1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(151, 20, 77, 0.8)";
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                p.y -= p.speed;
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();
        animate();

        // --- AUDIT LOGIC ---
        const steps = [
            "Handshaking with Starborn Vault...",
            "Decrypting vector assets...",
            "Masking PII with HMAC-SHA256...",
            "Running IQR Capital Variance...",
            "Compiling structural verdict..."
        ];

        async function processAudit() {
            const fileInput = document.getElementById('csvFile');
            const btn = document.getElementById('upload-btn');
            const display = document.getElementById('results-display');
            const logContainer = document.getElementById('log-entries');
            const logSection = document.getElementById('agent-log');

            if(!fileInput.files.length) return alert("VAULT ACCESS DENIED: NO LEDGER DETECTED");

            btn.disabled = true;
            btn.innerText = "SCRUBBING LEDGER...";
            logSection.style.opacity = '1';
            logContainer.innerHTML = '';
            document.querySelectorAll('.glass-card').forEach(c => c.classList.add('is-scanning'));

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // Simulation of logs while backend works
            const logPromise = (async () => {
                for(const s of steps) {
                    const div = document.createElement('div');
                    div.innerText = "✦ " + s;
                    logContainer.appendChild(div);
                    logContainer.scrollTop = logContainer.scrollHeight;
                    await new Promise(r => setTimeout(r, 700));
                }
            })();

            try {
                const res = await fetch('/api/audit', { method: 'POST', body: formData });
                const data = await res.json();
                await logPromise;

                if(data.status === "success") {
                    document.getElementById('health-score').innerText = data.sutra_health;
                    document.getElementById('risk-score').innerText = data.risk_score;
                    document.getElementById('transaction-count').innerText = "VECTORS: " + data.audited_capacity;
                    document.getElementById('ai-verdict-text').innerText = data.verdict || data.summary;
                    display.classList.remove('hidden');
                    display.scrollIntoView({ behavior: 'smooth' });
                }
            } catch(e) {
                alert("PROTOCOL FAULT: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "AUDIT SEALED";
                document.querySelectorAll('.glass-card').forEach(c => c.classList.remove('is-scanning'));
            }
        }
    </script>
</body>
</html>
