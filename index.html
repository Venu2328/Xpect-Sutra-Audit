<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XPECT | Sovereign AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #97144D; --accent: #FF3D68; }
        body {
            font-family: 'Space+Grotesk', sans-serif;
            background: #ffffff;
            color: #000;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Particle Nebula (Light Version) */
        #nebula-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* Sovereign Floating Animation */
        .sovereign-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }

        /* The "XPECT" Shimmer */
        .shimmer {
            background: linear-gradient(90deg, #000, var(--primary), #000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }

        /* High-End Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(151, 20, 77, 0.1);
            border-radius: 40px;
            box-shadow: 0 30px 60px -12px rgba(151, 20, 77, 0.08);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 40px 80px -15px rgba(151, 20, 77, 0.15);
        }

        /* Audit Pulse */
        .is-scanning { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .btn-xpect {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 20px;
            color: white;
            font-weight: 700;
            letter-spacing: 3px;
            box-shadow: 0 15px 35px rgba(151, 20, 77, 0.25);
            transition: all 0.4s ease;
        }
        .btn-xpect:hover { transform: scale(1.05); filter: brightness(1.1); }
    </style>
</head>
<body class="antialiased">

    <canvas id="nebula-canvas"></canvas>

    <div class="max-w-7xl mx-auto px-6 py-12">
        <header class="text-center mb-24 sovereign-float">
            <div class="inline-block p-1 mb-6 rounded-3xl bg-gradient-to-tr from-[#97144D] to-[#FF3D68]">
                <div class="px-8 py-3 bg-white rounded-[22px] text-[10px] font-bold tracking-[0.5em] uppercase text-gray-500">
                    Neural Analytics Platform
                </div>
            </div>
            <h1 class="text-8xl md:text-[12rem] font-bold tracking-tighter leading-none mb-4 shimmer">
                XPECT
            </h1>
            <p class="text-xs tracking-[1em] text-gray-400 font-medium uppercase italic ml-4">Architecture of Sovereignty</p>
        </header>

        <main class="grid lg:grid-cols-12 gap-12 items-start">
            
            <div class="lg:col-span-5 space-y-8">
                <section class="glass-card p-12">
                    <h2 class="text-[10px] font-bold tracking-[0.3em] text-gray-400 mb-10 uppercase italic">Deposit Financial Vector</h2>
                    <div class="relative group mb-10">
                        <input type="file" id="csvFile" accept=".csv" class="hidden">
                        <label for="csvFile" class="flex flex-col items-center justify-center border-2 border-dashed border-gray-100 rounded-[30px] p-16 cursor-pointer hover:bg-gray-50/50 transition-all">
                            <span id="file-label" class="text-gray-400 text-xs font-bold uppercase tracking-widest">Select Ledger</span>
                        </label>
                    </div>
                    <button onclick="runAudit()" id="run-btn" class="btn-xpect w-full py-7 uppercase text-xs">Initialize Analysis</button>
                </section>
            </div>

            <div class="lg:col-span-7">
                <section id="results" class="hidden space-y-8">
                    <div class="grid grid-cols-2 gap-6">
                        <div class="glass-card p-10">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Sutra Health</p>
                            <h2 id="m-health" class="text-6xl font-bold text-[#97144D] tracking-tighter">--</h2>
                        </div>
                        <div class="glass-card p-10">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-4">Volatility</p>
                            <h2 id="m-risk" class="text-6xl font-bold text-black tracking-tighter">--</h2>
                        </div>
                    </div>

                    <div class="glass-card p-12 border-l-[12px] border-l-[#97144D]">
                        <div class="flex justify-between items-start mb-10">
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Neural Verdict</p>
                            <span id="m-vol" class="text-xs font-bold px-4 py-1 bg-gray-100 rounded-full">--</span>
                        </div>
                        <h3 id="r-verdict" class="text-4xl md:text-6xl font-light text-black tracking-tight leading-[1.1] mb-12 italic">--</h3>
                        
                        <div class="grid md:grid-cols-2 gap-8 pt-8 border-t border-gray-100">
                            <div>
                                <p class="text-[9px] font-black text-[#97144D] uppercase mb-2">Concentration Index</p>
                                <p id="r-conc" class="text-lg font-medium text-gray-600">--</p>
                            </div>
                            <div>
                                <p class="text-[9px] font-black text-[#97144D] uppercase mb-2">Velocity Analytics</p>
                                <p id="r-vel" class="text-lg font-medium text-gray-600">--</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

        </main>

        <footer class="mt-40 text-center opacity-40">
            <p class="text-[9px] tracking-[1.5em] text-gray-500 uppercase">Proprietary Xpect Engine • v4.0.1</p>
        </footer>
    </div>

    <script>
        // Particle Background Logic (The "Starborn" feel)
        const canvas = document.getElementById('nebula-canvas');
        const ctx = canvas.getContext('2d');
        let parts = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<70; i++) parts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*3, v: Math.random()*0.4 });
        }
        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "#97144D";
            parts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI*2); ctx.fill(); p.y -= p.v; if(p.y < 0) p.y = canvas.height; });
            requestAnimationFrame(draw);
        }
        init(); draw();

        document.getElementById('csvFile').onchange = function() {
            document.getElementById('file-label').innerText = this.files[0].name;
        };

        async function runAudit() {
            const file = document.getElementById('csvFile').files[0];
            if(!file) return alert("VAULT ACCESS DENIED");
            
            const btn = document.getElementById('run-btn');
            btn.disabled = true; btn.innerText = "SCRUBBING LEDGER...";
            document.querySelectorAll('.glass-card').forEach(c => c.classList.add('is-scanning'));

            const fd = new FormData(); fd.append('file', file);
            try {
                const res = await fetch('/api/audit', { method: 'POST', body: fd });
                const d = await res.json();
                if(d.status === 'success') {
                    document.getElementById('m-health').innerText = d.metrics.health;
                    document.getElementById('m-risk').innerText = d.metrics.risk;
                    document.getElementById('m-vol').innerText = "VOL: " + d.metrics.vol;
                    document.getElementById('r-conc').innerText = d.analyst_report.concentration;
                    document.getElementById('r-vel').innerText = d.analyst_report.velocity;
                    document.getElementById('r-verdict').innerText = d.analyst_report.verdict;
                    document.getElementById('results').classList.remove('hidden');
                    document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
                }
            } catch(e) { alert("FAULT DETECTED"); }
            finally { btn.disabled = false; btn.innerText = "AUDIT COMPLETE"; document.querySelectorAll('.glass-card').forEach(c => c.classList.remove('is-scanning')); }
        }
    </script>
</body>
</html>
